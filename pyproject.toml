[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-foundation"
version = "0.1.0"
description = "Fundacao local e simulada do Trading Bot Dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "websockets>=15,<17",
  "alpaca-py>=0.44.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "httpx2>=2.12.0",
]

[tool.setuptools.packages.find]
include = ["services*", "packages*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requer PostgreSQL dedicado do Docker Compose"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services", "packages", "infrastructure/docker/migrations"]
plugins = ["pydantic.mypy"]
