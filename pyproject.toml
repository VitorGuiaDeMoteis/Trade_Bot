[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-foundation"
version = "0.1.0"
description = "Fundacao local e simulada do Trading Bot Dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "websockets>=15,<17",
  "httpx>=0.28.1",
  "exchange-calendars>=4.11,<5",
]

[project.scripts]
research = "research.momentum_v1.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "httpx2>=2.12.0",
]
research = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
    "types-requests>=2.33.0.20260906",
    "yfinance>=1.7.0",
]

[tool.setuptools.packages.find]
include = ["services*", "packages*", "scripts*", "research*"]

[tool.setuptools.package-data]
"services.api" = ["static/*.html"]
"services.replay" = ["data/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "research/momentum_v1/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requer PostgreSQL dedicado do Docker Compose"]

[tool.mypy]
mypy_path = "stubs"
python_version = "3.12"
strict = true
files = ["services", "packages", "infrastructure/docker/migrations", "research/momentum_v1"]
plugins = ["pydantic.mypy"]
